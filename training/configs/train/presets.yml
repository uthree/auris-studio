# Model size presets.
#
# A training config selects one with:
#
#   defaults:
#     - presets.yml: base
#
# `n_vocab` and `n_speakers` are filled in from the preprocessed dataset by
# scripts/train.py, so they are deliberately absent here.

small:
  model:
    spec_channels: 1025
    inter_channels: 192
    hidden_channels: 192
    gin_channels: 256
    segment_size: 32          # frames decoded per step (32 * 480 = 0.32 s)
    sample_rate: 48000
    hop_length: 480
    text_encoder:
      n_layers: 4
      n_heads: 2
      dropout: 0.1
    posterior_encoder:
      n_layers: 4
      n_heads: 2
      dropout: 0.0
    flow:
      n_flows: 4
      n_layers: 2
      n_heads: 2
    prior_encoder:
      n_layers: 4
      n_heads: 2
      dropout: 0.1
    generator:
      upsample_initial_channel: 256
      upsample_rates: [6, 5, 4, 4]
      upsample_kernel_sizes: [12, 10, 8, 8]
      resblock_kernel_sizes: [3, 7, 11]
      resblock_dilations: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  discriminator:
    periods: [2, 3, 5, 7, 11]
    resolutions:
      - [512, 120, 512]
      - [1024, 240, 1024]
      - [2048, 480, 2048]
    period_kwargs:
      channels: [16, 64, 256, 512, 512]
    stft_kwargs:
      channels: 32

base:
  model:
    spec_channels: 1025
    inter_channels: 192
    hidden_channels: 256
    gin_channels: 256
    segment_size: 32
    sample_rate: 48000
    hop_length: 480
    text_encoder:
      n_layers: 6
      n_heads: 4
      dropout: 0.1
    posterior_encoder:
      n_layers: 6
      n_heads: 4
      dropout: 0.0
    flow:
      n_flows: 4
      n_layers: 3
      n_heads: 4
    prior_encoder:
      n_layers: 6
      n_heads: 4
      dropout: 0.1
    generator:
      upsample_initial_channel: 512
      upsample_rates: [6, 5, 4, 4]
      upsample_kernel_sizes: [12, 10, 8, 8]
      resblock_kernel_sizes: [3, 7, 11]
      resblock_dilations: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  discriminator:
    periods: [2, 3, 5, 7, 11]
    resolutions:
      - [512, 120, 512]
      - [1024, 240, 1024]
      - [2048, 480, 2048]
      - [4096, 960, 4096]
    period_kwargs:
      channels: [32, 128, 512, 1024, 1024]
    stft_kwargs:
      channels: 32
