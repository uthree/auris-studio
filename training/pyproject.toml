[project]
name = "auris-singer"
version = "0.1.0"
description = "VITS-based singing voice synthesizer with an NSF-HiFi-GAN vocoder at 48 kHz"
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Named rather than pointed at a file: the licence is the repository's one `LICENSE`, a
# directory above, and a path that leaves the project root is not something a build backend
# will follow.
license = "Apache-2.0"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    # Trainer.fit gained the safe weights_only checkpoint loader in 2.6.
    "lightning>=2.6",
    "omegaconf>=2.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "numba>=0.59",
    "tqdm>=4.66",
    "torchfcpe>=0.0.4",
    "jpreprocess>=0.1.7",
    "tensorboard>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# scripts/export_onnx.py — torch's dynamo-based exporter needs onnxscript,
# and onnxruntime is what the export is verified against.
export = [
    "onnx>=1.17",
    "onnxscript>=0.2",
    "onnxruntime>=1.20",
]
# scripts/evaluate_host.py --asr — the listener behind the phoneme error rate. ReazonSpeech
# is published from its repository rather than PyPI; the k2 package rides on sherpa-onnx,
# whose wheel it does not itself require, so both are named here.
asr = [
    "reazonspeech-k2-asr @ git+https://github.com/reazon-research/ReazonSpeech#subdirectory=pkg/k2-asr",
    "sherpa-onnx>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyTorch is deliberately not pinned to one of pytorch.org's per-CUDA indexes. It was, to the
# CUDA 12.8 wheels, which is right on a training machine and wrong everywhere else this project
# now lives: CI has no NVIDIA driver at all, and neither does a machine that only runs the
# contract test. `uv pip install --torch-backend=auto` reads the installed driver and chooses the
# index itself, so the one command serves both — see `doc/development.md`.

[tool.hatch.build.targets.wheel]
packages = ["src/auris_singer"]

# The `asr` extra names a git repository, which hatchling refuses in metadata unless told
# that this project is not going to be published to an index — and it is not.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: tests that load the FCPE model or the jpreprocess dictionary (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
