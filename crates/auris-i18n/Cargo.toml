[package]
name = "auris-i18n"
description = "Interface text for Auris Studio in every language it speaks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Deliberately at the very bottom of the graph: this is a table of strings, so anything that
# shows text to a person can depend on it without dragging the engine along.
[dependencies]
serde = { workspace = true, features = ["derive"] }

# Windows sets none of the POSIX locale variables, so the only way to learn what language the
# machine is in is to ask. `windows-sys` is already in the tree by way of the file dialogs, and
# this pulls one function out of it.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
serde_json.workspace = true
