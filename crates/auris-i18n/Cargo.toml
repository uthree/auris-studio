[package]
name = "auris-i18n"
description = "Interface text for Auris Studio in every language it speaks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Deliberately at the very bottom of the graph: this is a table of strings, so anything that
# shows text to a person can depend on it without dragging the engine along.
[dependencies]
serde = { workspace = true, features = ["derive"] }

# The table itself lives in `locales/`, one TOML file per language; atelier-i18n's generator turns
# it into Rust at build time and its runtime half asks the system which language to show.
atelier-i18n = { git = "https://github.com/uthree/design-language", tag = "v0.4.0" }

[build-dependencies]
atelier-i18n = { git = "https://github.com/uthree/design-language", tag = "v0.4.0", features = ["build"] }

[dev-dependencies]
serde_json.workspace = true
