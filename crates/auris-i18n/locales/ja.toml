CliUsage = "auris — コマンドラインから使う Auris Studio\n\n使い方\n    auris <コマンド> [オプション]\n\nコマンド\n    progressions                  名前の付いたコード進行を一覧表示\n    plugins                       登録済みの音源とエフェクトを一覧表示\n    soundfonts [--manifest]       同梱サウンドフォントを一覧表示\n    dictionary [--manifest]       同梱日本語辞書とその導入状態を表示\n    info <project.auris>          プロジェクトのトラック・クリップ・長さを表示\n    analyze-chords <project.auris> [--track <name>] [--apply]\n                                  ノーツからコードをCPUで推定\n    analyze-audio <audio-file>    音声のBPMとメジャー・マイナーコードをCPUで推定\n    analyze-instruments <audio-file> --model <yamnet.onnx> [--threshold 0.2]\n    render <project.auris> [opts] プロジェクトを WAV に書き出す\n    video <project.auris> [opts]  ノートが流れる動画を ffmpeg で書き出す\n    sing <project.auris> [opts]   シンガートラックを声のモデルで歌わせる\n    frames <project.auris> [opts] シンガートラックが声のモデルに渡すフレームを書き出す\n    sing-frames <frames.json> [opts]\n                                  フレームファイルを声のモデルで歌わせて WAV にする\n    new <project.auris> [opts]    ソフト音源トラック 1 本のプロジェクトを作成\n    collect <project.auris>       プロジェクトが使うファイルをフォルダ内に集める\n    analyze-drums <project.auris> --track <name|id:number> [--apply] [--remap-clips]\n                                  実際の出音を解析し、ドラムの割り当てを提案する\n        --first-note <n> --last-note <n>  測定するMIDIノートの範囲を指定（既定: 0〜127）\n    help                          このメッセージを表示\n\nrender のオプション\n    -o, --output <file.wav>       出力先（既定: プロジェクトと同じ場所）\n        --bit-depth <16|24|32>    量子化ビット数。32 は 32bit float（既定: 24）\n        --dither                  TPDF ディザを付加（16bit マスター向け）\n        --no-tail                 エフェクトの残響を待たず最後のクリップで終える\n        --loop                    サイクル範囲のみを書き出す\n        --stems <folder>          ミックスの代わりにトラックごとのファイルをフォルダに書き出す\n        --force                   出力ファイルが既にあれば置き換える\n\nsing のオプション\n        --track <name>            歌わせるシンガートラック（既定: プロジェクト唯一の 1 本）\n        --voice <voice-file>      先にボイスを選んで記憶させる\n                                  dsconfig.yaml、.voicevox.json、.leapsinger.json\n        --speaker <name>          声のどの話者が歌うかを選んで記憶させる\n        --seed <n>                合成用シード（対応ボイスのみ。既定: 現在のテイクのシード）\n\nframes のオプション\n        --track <name>            対象のシンガートラック（既定: プロジェクト唯一の 1 本）\n    -o, --output <file.json>      出力先（既定: プロジェクトと同じ場所）\n\nsing-frames のオプション\n        --voice <voice-file>      歌わせるボイス（必須）\n        --speaker <name>          声のどの話者が歌うか（既定: 最初の話者）\n        --seed <n>                合成用シード（対応ボイスのみ。既定: 0）\n        --acceleration <auto|gpu|cpu>\n                                  モデルの推論を走らせる場所（既定: auto）\n    -o, --output <file.wav>       出力先（既定: フレームファイルと同じ場所）\n        --report <file.json>      テイクの情報と所要時間を JSON でも書き出す\n\nvideo のオプション（既定: デスクトップ版で最後に選んだ見た目）\n    -o, --output <file.mp4>       出力先（既定: プロジェクトと同じ場所）\n        --size <width>x<height>   画面サイズ（例: 1920x1080）\n        --fps <n>                 1 秒あたりのフレーム数\n        --colors <track|palette|pitch|single>\n                                  ノートの色の付け方\n        --background <image>      ノートの背後に敷く PNG・JPEG・WebP\n        --seconds <n>             画面の幅に収める曲の秒数\n        --lead-in <seconds>       演奏が始まる前の無音の秒数（既定: 1）\n        --tail <seconds>          演奏が終わった後の無音の秒数（既定: 2）\n        --particles <amount>      再生線でノートが散らす火花の量（0 でなし、1 が標準）\n        --sink <amount>           演奏中のノートが沈み込む深さ（0 で動かない、1 が標準）\n        --parallax <amount>       トラックごとにスクロール速度をずらす奥行き（既定の 0 で平面、1 が標準）\n        --drums                   ドラムトラックも描く\n        --no-chords               左上のコード名を表示しない\n        --no-lyrics               歌詞の字幕を表示しない\n        --no-tempo                右上のテンポ（BPM）を表示しない\n        --no-beats                右上の拍子カウンターを表示しない\n\nnew のオプション\n        --bpm <tempo>             新規プロジェクトのテンポ（既定: 120）\n        --sample-rate <hz>        新規プロジェクトのサンプルレート（既定: 48000）\n        --force                   同名のプロジェクトフォルダがあっても書き出す"
