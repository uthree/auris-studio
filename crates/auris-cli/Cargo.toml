[package]
name = "auris-cli"
description = "Command line frontend for Auris Studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "auris"
path = "src/main.rs"

[dependencies]
auris-i18n.workspace = true
auris-session.workspace = true
env_logger.workspace = true
log.workspace = true
# The `--report` of `sing-frames` is the session's own account of the take, written out as it
# is; the CLI adds no field of its own to it.
serde_json.workspace = true
