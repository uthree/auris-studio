# The singer's language: lyrics to IPA phonemes, and notes to the frame-level features a
# voice model is fed.
[package]
name = "auris-vocal"
description = "Vocal-synthesis frontend for Auris Studio: lyrics to phonemes, notes to frames"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Depends on the document model and nothing else local, the same shape as `auris-compose`: this
# crate reads notes and writes phonemes and frames; it must never learn what a sample or a
# window is.
#
# `jpreprocess` is the Japanese text frontend (OpenJTalk rewritten in Rust). Its dictionary is
# loaded **at run time** from a folder the user points at — the crate's own `naist-jdic` feature
# bundles one, but its build script downloads it from a GitHub release, and a build that needs
# the network is a build that fails on the wrong day. Lyrics written in kana need no dictionary
# at all; see `kana`.
[dependencies]
auris-core.workspace = true
jpreprocess = "0.15"
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
