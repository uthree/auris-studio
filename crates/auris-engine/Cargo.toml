[package]
name = "auris-engine"
description = "Realtime and offline audio rendering engine for Auris Studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The engine drives plugins only through the `auris-core` traits, so it deliberately does not
# depend on `auris-dsp` or `auris-synth`; the binary is what installs those into the registry.
[dependencies]
auris-core.workspace = true
cpal.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { workspace = true, features = ["asio", "realtime"] }
