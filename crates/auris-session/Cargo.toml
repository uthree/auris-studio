auris-dsp.workspace = true
auris-engine.workspace = true
auris-gpu.workspace = true
auris-i18n.workspace = true
auris-io.workspace = true
auris-synth.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
