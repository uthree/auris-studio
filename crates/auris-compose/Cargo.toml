[package]
name = "auris-compose"
description = "Phrase-level automatic composition for Auris Studio: a clip recipe and a harmony in, notes out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Depends on the document model and nothing else. This crate writes notes; it must never learn
# what a sample is, which is why `auris-dsp`, `auris-synth` and `auris-engine` are absent.
# `serde` carries a General MIDI program's name through a document.
[dependencies]
auris-core.workspace = true
serde.workspace = true

# For the tests only: a General MIDI program's serde round trip, read in isolation.
[dev-dependencies]
serde_json.workspace = true
