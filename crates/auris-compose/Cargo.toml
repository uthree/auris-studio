[package]
name = "auris-compose"
description = "Score-based automatic composition for Auris Studio: a text spec in, notes on a timeline out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Depends on the document model and nothing else. This crate writes notes; it must never learn
# what a sample is, which is why `auris-dsp`, `auris-synth` and `auris-engine` are absent.
#
# `toml` is the syntax of a song specification, and `serde` reads and writes it. Neither is a new
# crate in the build: both are already in `Cargo.lock`, pulled in by build-time tooling. A
# composition is still handed straight to the session — it is the *specification* that has to
# survive a round trip through a file, so that a dialog can save what it was set to.
[dependencies]
auris-core.workspace = true
serde.workspace = true
toml.workspace = true

# For the tests only, and only to exercise a single value's serde in isolation: TOML has no
# notion of a bare scalar document, so a round trip through it would be a round trip through a
# table wrapping the thing under test.
[dev-dependencies]
serde_json.workspace = true
