[package]
name = "auris-gpui"
description = "The gpui desktop frontend for Auris Studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
asio = ["auris-session/asio"]

[[bin]]
name = "auris-studio"
path = "src/main.rs"

# The frontend uses the session, presentation libraries and UI-free agent transport.
# If this list ever needs `auris-engine` or `auris-dsp` directly, something that belongs in the
# session layer has leaked into the UI.
[dependencies]
auris-agent.workspace = true
auris-i18n.workspace = true
auris-session.workspace = true
env_logger.workspace = true
log.workspace = true

# `runtime_shaders` makes gpui compile its Metal shaders through the Metal framework at startup.
# The build-time path shells out to `xcrun metal`, which lives inside Xcode and is unreachable
# while `xcode-select -p` points at the Command Line Tools.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
# Atelier's adopted Glass language, pinned to its main after v0.4.0 for the Markdown and
# message-chip layout fixes (design-language#53); back to a tag at the next release.
atelier = { git = "https://github.com/uthree/design-language", rev = "2220fa14a34bed767e53b2fe165af900192328eb" }
gpui-flow = { path = "../../vendor/gpui-flow" }
# Menus, the rhythm grid and a few setup surfaces still draw with it; the agent transcript's
# Markdown is Atelier's now. It shares gpui's version and stays wholly inside this crate.
# Later component releases require GPUI snapshots; 0.5.1 is the latest compatible release.
gpui-component = "=0.5.1"
# A tool answers with its pictures base64-encoded on the agent wire.
base64.workspace = true
# Decode voice artwork on a worker, with bounded dimensions before GPUI sees the pixels.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rfd = "0.17"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
semver.workspace = true
ureq.workspace = true
hex.workspace = true
sha2.workspace = true
tempfile.workspace = true
# Decodes the file URLs macOS hands over when a project is double-clicked in Finder.
url.workspace = true
jsonc-parser = { version = "0.26", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0"

# The same gpui, with its test platform switched on: a window with no display, no GPU and no font
# system behind it, driven from `cargo test`. Only the test build gets it — a dev-dependency is
# not linked into the binary — and `test-support` is also what turns `debug_selector` from a
# no-op into the hook `VisualTestContext::debug_bounds` reads.
[dev-dependencies]
hound.workspace = true
gpui = { version = "=0.2.2", features = ["runtime_shaders", "test-support"] }
tempfile.workspace = true
