# Singing-voice synthesis: external singing backends, run offline over a singer track's
# frames. Frames in, a waveform out — never on the audio thread.
[package]
name = "auris-singer"
description = "Singing-voice synthesis for Auris Studio: DiffSinger, LeapSinger and VOICEVOX"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Depends on the document model and the frame renderer, nothing else local — the same shape as
# `auris-vocal`, whose output this crate consumes.
#
# `ort` is onnxruntime. Its default `download-binaries` feature fetches the prebuilt runtime
# library at *build* time, which looks like the network-in-the-build that got `naist-jdic`
# rejected — but the two are not alike: the dictionary was runtime data with a runtime home
# (a folder in the settings), while this is a link-time artifact, the same thing any `-sys`
# crate obtains, cached by cargo like every other dependency. The *voice model* itself is
# runtime data and is loaded from wherever the user keeps it, exactly like a SoundFont.
[dependencies]
auris-core.workspace = true
auris-vocal.workspace = true
base64.workspace = true
hound.workspace = true
log.workspace = true
# ONNX Runtime has not reached a stable 2.0 release; keep all workspace consumers on this
# release candidate so Cargo cannot resolve incompatible runtime libraries.
ort.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
ureq.workspace = true
unicode-normalization.workspace = true

# The GPU execution providers, one per desktop platform, both riding the OS itself: DirectML
# is part of Windows and Core ML part of macOS, so neither adds a runtime to ship. The
# features and provider APIs are target-gated to keep each platform on its native runtime.
[target.'cfg(target_os = "windows")'.dependencies]
ort = { workspace = true, features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }
