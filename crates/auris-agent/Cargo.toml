# UI-free model runtime linked into the desktop. Rig, Tokio and the HTTP clients stay here;
# the desktop exchanges channel messages with a cancellable background worker.
[package]
name = "auris-agent"
description = "Background LLM worker library for Auris Studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
asio = ["auris-session/asio"]

[lib]
path = "src/lib.rs"

[dependencies]
auris-session.workspace = true
auris-toolbox.workspace = true
log.workspace = true
rig = "0.42"
# Audio attachments ride the wire base64-encoded. The same version rig resolves, so no
# second copy is compiled.
base64 = "0.22"
# For asking Ollama what it serves and Brave Search what the public web contains. The same
# version rig resolves, so no second copy is compiled.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
# `time` bounds the `models` listing, so a black-holed server resolves into an error.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
