[package]
name = "auris-clap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Hosting of third-party CLAP plugins for Auris Studio"

[features]
# A CLAP plugin linked into the binary, so the crates above this one can test hosting without a
# `.clap` installed on the machine. Off by default: an application shipping a test plugin inside
# itself would be absurd.
testkit = ["dep:clack-plugin", "clack-host/clack-plugin", "clack-extensions/clack-plugin"]

[dependencies]
auris-core = { workspace = true }
clack-host = { workspace = true }
clack-extensions = { workspace = true, features = [
    "clack-host",
    "audio-ports",
    "gui",
    "latency",
    "note-ports",
    "params",
    "state",
    "timer",
    # So a parent window can be named by the handle the platform already gave the frontend,
    # rather than by a bare pointer this crate would have to be trusted to have tagged right.
    "raw-window-handle_06",
] }
clack-plugin = { workspace = true, optional = true }
log = { workspace = true }
raw-window-handle = { workspace = true }
thiserror = { workspace = true }

# The window a plugin is embedded in. Only reachable through the platform's own API, so this is
# one of the few places `#[cfg]` is right rather than `cfg!` — there is no other arm to compile.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { workspace = true, features = ["NSGeometry", "NSString"] }

[dev-dependencies]
# The same fixture this crate's own tests need, without turning the feature on for everybody.
clack-host = { workspace = true, features = ["clack-plugin"] }
clack-plugin = { workspace = true }
clack-extensions = { workspace = true, features = ["clack-plugin"] }
