name: Release

# Tagging is what publishes. `v0.1.0` on a commit that has already been through CI builds the
# three archives and creates the release from the matching section of CHANGELOG.md.
#
# `workflow_dispatch` builds from a branch or an existing release tag and stops before publishing.
# Select one platform to recover a failed archive without moving the tag or rebuilding the others.
# Packaging helpers come from the workflow commit; application sources and archive contents come
# from the selected ref.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to package (leave empty for a branch dry run)
        type: string
        required: false
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, macos, windows, linux]

env:
  CARGO_TERM_COLOR: always
  RELEASE_NAME: ${{ inputs.release_tag || github.ref_name }}

# Deliberately uncached, unlike CI. This runs a handful of times a year and produces the files
# other people download; a cold build is worth the twenty minutes.
jobs:
  # One universal binary rather than one per architecture: both halves are built on the same
  # runner and joined with `lipo`, so an Intel Mac and an Apple Silicon one take the same file.
  # The alternative is a second runner image for x86_64, and those are being retired.
  macos:
    name: Build for macOS
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      # A dispatched recovery can keep the application at an immutable tag while taking
      # corrected packaging helpers from the commit that supplied this workflow.
      - name: Load packaging helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            tools/fetch-soundfonts.sh
            tools/fetch-dictionary.sh
          sparse-checkout-cone-mode: false

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # ONNX Runtime's Core ML objects use Apple's availability checks. Rust drives the final
      # linker directly, so carry the compiler runtime that provides those symbols with it.
      - name: Link the Apple compiler runtime
        run: |
          clang_runtime="$(xcrun --sdk macosx clang -print-libgcc-file-name)"
          echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=$clang_runtime" >> "$GITHUB_ENV"

      - name: Build both architectures
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" -p auris-gpui -p auris-cli -p auris-mcp
          done
          native_target="$(rustc -vV | sed -n 's/^host: //p')"
          echo "AURIS_CLI=$PWD/target/$native_target/release/auris" >> "$GITHUB_ENV"

      # After the build, because the scripts ask the command line tool what to fetch — the
      # manifests live in `auris_session::library` and are not duplicated in the scripts.
      - name: Fetch the shipped SoundFonts
        run: bash .release-tools/tools/fetch-soundfonts.sh "$PWD/SoundFonts"

      - name: Fetch the shipped Japanese dictionary
        run: bash .release-tools/tools/fetch-dictionary.sh "$PWD/Dictionary"

      # `Auris Studio.app` around the desktop binary, with the command line tool, the MCP
      # server and the LLM agent beside it.
      # Nothing is signed: this is a workflow with no certificate, and the release says what
      # Gatekeeper will make of that.
      - name: Assemble the archive
        run: |
          version="${RELEASE_NAME#v}"
          stage="auris-studio-${RELEASE_NAME}-macos-universal"
          app="$stage/Auris Studio.app"
          mkdir -p "$app/Contents/MacOS"

          cp crates/auris-gpui/macos/Info.plist "$app/Contents/Info.plist"
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$plist"

          for binary in auris-studio auris auris-mcp; do
            lipo -create -output "$stage/$binary" \
              "target/aarch64-apple-darwin/release/$binary" \
              "target/x86_64-apple-darwin/release/$binary"
          done
          mv "$stage/auris-studio" "$app/Contents/MacOS/auris-studio"

          # Inside the bundle's resource directory, because that is what makes dragging
          # `Auris Studio.app` to /Applications carry the sounds with it — a font left beside the
          # bundle would be a fresh installation with no instruments in it.
          #
          # The `auris` binary sits *beside* the bundle rather than in it and only ever searches
          # upwards, so it is given a link to the same directory rather than a second copy. Two
          # copies would be four hundred megabytes to save a symlink.
          mkdir -p "$app/Contents/Resources"
          cp crates/auris-gpui/assets/auris-studio.icns "$app/Contents/Resources/auris-studio.icns"
          cp -R SoundFonts "$app/Contents/Resources/SoundFonts"
          ln -s "Auris Studio.app/Contents/Resources/SoundFonts" "$stage/SoundFonts"
          # The Japanese dictionary travels the same way, for the same two readers.
          cp -R Dictionary "$app/Contents/Resources/Dictionary"
          ln -s "Auris Studio.app/Contents/Resources/Dictionary" "$stage/Dictionary"

          cp README.md CHANGELOG.md LICENSE "$stage/"
          # The README links into `docs/`, so an archive without it has dead links in the
          # first file anybody opens.
          cp -R docs "$stage/docs"
          tar -czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: auris-studio-*-macos-universal.tar.gz
          if-no-files-found: error

  windows:
    name: Build for Windows
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    env:
      AURIS_CLI: ./target/release/auris.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Load packaging helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            tools/fetch-soundfonts.sh
            tools/fetch-dictionary.sh
            tools/fetch-dictionary.ps1
          sparse-checkout-cone-mode: false

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare LLVM for ASIO
        shell: pwsh
        run: ./tools/setup-windows.ps1 -InstallLlvm

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build
        shell: pwsh
        run: |
          $frontends = @('auris-gpui', 'auris-cli', 'auris-mcp')
          $metadataJson = cargo metadata --no-deps --format-version 1 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the checked-out Cargo workspace.' }
          $metadata = $metadataJson | ConvertFrom-Json
          $asioFrontends = @(
            foreach ($name in $frontends) {
              $package = @($metadata.packages | Where-Object { $_.name -eq $name -and $_.id -in $metadata.workspace_members })
              if ($package.Count -ne 1) { throw "Expected one workspace package named $name." }
              if ('asio' -in $package[0].features.PSObject.Properties.Name) { $name }
            }
          )
          $buildArgs = @('build', '--release', '--locked')
          # New releases opt into ASIO; historical tags included it without a feature.
          if ($asioFrontends.Count -eq $frontends.Count) {
            $buildArgs += @('--features', 'asio')
          } elseif ($asioFrontends.Count -ne 0) {
            throw "Inconsistent ASIO features across release frontends; only these expose asio: $($asioFrontends -join ', ')."
          }
          foreach ($name in $frontends) { $buildArgs += @('-p', $name) }
          cargo @buildArgs
          exit $LASTEXITCODE

      - name: Fetch the shipped SoundFonts
        shell: bash
        run: bash .release-tools/tools/fetch-soundfonts.sh "$PWD/SoundFonts"

      - name: Fetch the shipped Japanese dictionary
        shell: pwsh
        run: ./.release-tools/tools/fetch-dictionary.ps1 -Destination (Join-Path $PWD 'Dictionary') -AurisPath ./target/release/auris.exe

      - name: Assemble the archive
        shell: bash
        run: |
          stage="auris-studio-${RELEASE_NAME}-windows-x86_64"
          mkdir -p "$stage"
          cp target/release/auris-studio.exe target/release/auris.exe target/release/auris-mcp.exe "$stage/"
          # Beside the binaries, which is the first place `auris_session::library` looks.
          cp -R SoundFonts "$stage/SoundFonts"
          cp -R Dictionary "$stage/Dictionary"
          cp README.md CHANGELOG.md LICENSE "$stage/"
          # The README links into `docs/`, so an archive without it has dead links in the
          # first file anybody opens.
          cp -R docs "$stage/docs"
          7z a "$stage.zip" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: auris-studio-*-windows-x86_64.zip
          if-no-files-found: error

  # The command line tool only. The desktop application ships for macOS and Windows; CI does not
  # build the gpui frontend on Linux, and a release is the wrong place to find out whether it
  # would have.
  linux:
    name: Build the command line tool for Linux
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    env:
      AURIS_CLI: ./target/release/auris
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Load packaging helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            tools/fetch-soundfonts.sh
            tools/fetch-dictionary.sh
          sparse-checkout-cone-mode: false

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      # cpal builds against ALSA here, and vst3-host links against XCB.
      - name: Install Linux development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libxcb1-dev

      - name: Build
        run: cargo build --release --locked -p auris-cli

      - name: Fetch the shipped SoundFonts
        run: bash .release-tools/tools/fetch-soundfonts.sh "$PWD/SoundFonts"

      - name: Fetch the shipped Japanese dictionary
        run: bash .release-tools/tools/fetch-dictionary.sh "$PWD/Dictionary"

      - name: Assemble the archive
        run: |
          stage="auris-${RELEASE_NAME}-linux-x86_64"
          mkdir -p "$stage"
          cp target/release/auris "$stage/"
          # The command line tool composes too, and a piece written on Linux has to be the piece
          # written on Windows. Skipping the fonts here would make `auris compose` quietly answer
          # in three oscillators on one platform and an orchestra on the others. The dictionary
          # rides along for the same reason: a lyric composed here has to follow its accent the
          # way it would anywhere else.
          cp -R SoundFonts "$stage/SoundFonts"
          cp -R Dictionary "$stage/Dictionary"
          cp README.md CHANGELOG.md LICENSE "$stage/"
          # The README links into `docs/`, so an archive without it has dead links in the
          # first file anybody opens.
          cp -R docs "$stage/docs"
          tar -czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: auris-*-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    # Only `gh release create` writes to the repository; build jobs remain read-only.
    permissions:
      contents: write
    name: Publish the release
    needs: [macos, windows, linux]
    # Only from a tag. A dispatched run builds all three and stops here, which is the point of
    # being able to dispatch it at all.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The changelog is the release notes. Taken by heading rather than whole, so a release
      # describes itself and not every release before it; an empty extract fails the job, because
      # notes nobody wrote are worse than a release that did not go out.
      - name: Collect the notes
        run: |
          version="${RELEASE_NAME#v}"
          awk -v want="$version" '
            $0 ~ "^## " want "([ ]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > section.md
          if [ ! -s section.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            cat <<'PREAMBLE'
          ### Downloads

          | File | What it holds |
          | --- | --- |
          | `…-macos-universal.tar.gz` | `Auris Studio.app`, `auris`, and `auris-mcp` — Apple Silicon and Intel universal binaries |
          | `…-windows-x86_64.zip` | `auris-studio.exe`, `auris.exe`, and `auris-mcp.exe` |
          | `…-linux-x86_64.tar.gz` | the `auris` command line tool only |

          Every archive carries **MuseScore General**, a General MIDI SoundFont under the MIT
          licence, in a `SoundFonts` directory — which is most of the download size and all of the
          instruments beyond the four built in. Beside it, a `Dictionary` directory holds the
          **NAIST Japanese dictionary** (BSD-3-Clause, jpreprocess's build): what reads kanji
          lyrics, and what gives a melody composed from lyrics the words' pitch accent to follow.
          On macOS both live inside the bundle, so dragging `Auris Studio.app` to /Applications
          takes them along.

          None of it is code-signed. macOS will refuse the first launch and say the developer
          cannot be verified: open it from the right-click menu once, or run
          `xattr -dr com.apple.quarantine "Auris Studio.app"`. Windows SmartScreen wants
          *More info → Run anyway*.

          Auris Studio is at `0.x`, where nothing is stable: the project format, the configuration
          files and every public API may change in any release, with no migration.

          ---

          PREAMBLE
            cat section.md
          } > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_NAME" \
            --title "Auris Studio ${RELEASE_NAME}" \
            --notes-file notes.md \
            artifacts/*
