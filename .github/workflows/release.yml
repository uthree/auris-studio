name: Release

# Tagging is what publishes. `v0.1.0` on a commit that has already been through CI builds the
# three portable archives, two desktop installers and the matching release notes.
#
# `workflow_dispatch` builds from a branch or an existing release tag and stops before publishing.
# Select one platform to recover a failed archive without moving the tag or rebuilding the others.
# Packaging helpers come from the workflow commit; application sources and archive contents come
# from the selected ref.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to package (leave empty for a branch dry run)
        type: string
        required: false
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, macos, windows, linux]

env:
  CARGO_TERM_COLOR: always
  RELEASE_NAME: ${{ inputs.release_tag || github.ref_name }}

# Application builds are deliberately uncached.
jobs:
  # Apple Silicon only. Intel Macs were dropped in 0.19: macOS 26 is the last release Apple ships
  # for them, the x86_64 runner images are being retired, and `ort` has no Intel prebuilt, so
  # keeping them meant building ONNX Runtime from source on every release.
  macos:
    name: Build for macOS
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Name branch dry-run artifacts from Cargo version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "RELEASE_NAME=v$version" >> "$GITHUB_ENV"

      # A dispatched recovery can keep the application at an immutable tag while taking
      # corrected packaging helpers from the commit that supplied this workflow.
      - name: Load packaging helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            tools/fetch-dictionary.sh
          sparse-checkout-cone-mode: false

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin

      # ONNX Runtime's Core ML objects use Apple's availability checks. Rust drives the final
      # linker directly, so carry the compiler runtime that provides those symbols with it.
      - name: Link the Apple compiler runtime
        run: |
          clang_runtime="$(xcrun --sdk macosx clang -print-libgcc-file-name)"
          echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=$clang_runtime" >> "$GITHUB_ENV"

      - name: Build the application
        run: |
          if cargo metadata --no-deps --format-version 1 --locked | grep -q '"name":"auris-update-helper"'; then
            AURIS_UPDATE_HELPER=true
          else
            AURIS_UPDATE_HELPER=false
          fi
          echo "AURIS_UPDATE_HELPER=$AURIS_UPDATE_HELPER" >> "$GITHUB_ENV"
          build_args=(--release --locked --target aarch64-apple-darwin -p auris-gpui -p auris-cli -p auris-mcp)
          if [ "${AURIS_UPDATE_HELPER}" = true ]; then
            build_args+=(-p auris-update-helper)
          fi
          cargo build "${build_args[@]}"
          echo "AURIS_CLI=$PWD/target/aarch64-apple-darwin/release/auris" >> "$GITHUB_ENV"

      # After the build, because the scripts ask the command line tool what to fetch — the
      # manifests live in `auris_session::library` and are not duplicated in the scripts.
      - name: Fetch the shipped Japanese dictionary
        run: bash .release-tools/tools/fetch-dictionary.sh "$PWD/Dictionary"

      # Keep all four executables inside one app bundle so installing or upgrading the app
      # also installs the matching CLI, MCP server and update helper. Archive-root links keep
      # portable use.
      # Nothing is signed: this is a workflow with no certificate, and the release says what
      # Gatekeeper will make of that.
      - name: Assemble the archive
        run: |
          version="${RELEASE_NAME#v}"
          stage="auris-studio-${RELEASE_NAME}-macos-aarch64"
          app="$stage/Auris Studio.app"
          mkdir -p "$app/Contents/MacOS"

          cp crates/auris-gpui/macos/Info.plist "$app/Contents/Info.plist"
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$plist"

          binaries=(auris-studio auris auris-mcp)
          if [ "${AURIS_UPDATE_HELPER:-false}" = true ]; then
            binaries+=(auris-update-helper)
          fi
          for binary in "${binaries[@]}"; do
            cp "target/aarch64-apple-darwin/release/$binary" "$app/Contents/MacOS/$binary"
          done
          ln -s "Auris Studio.app/Contents/MacOS/auris" "$stage/auris"
          ln -s "Auris Studio.app/Contents/MacOS/auris-mcp" "$stage/auris-mcp"
          if [ "${AURIS_UPDATE_HELPER:-false}" = true ]; then
            ln -s "Auris Studio.app/Contents/MacOS/auris-update-helper" "$stage/auris-update-helper"
          fi

          # The dictionary travels inside the app. The archive-root link keeps the old
          # portable layout usable without duplicating the files.
          mkdir -p "$app/Contents/Resources"
          cp crates/auris-gpui/assets/auris-studio.icns "$app/Contents/Resources/auris-studio.icns"
          cp -R Dictionary "$app/Contents/Resources/Dictionary"
          ln -s "Auris Studio.app/Contents/Resources/Dictionary" "$stage/Dictionary"

          cp README.md README.ja.md CHANGELOG.md LICENSE "$stage/"
          # The README links into `docs/`, so an archive without it has dead links in the
          # first file anybody opens.
          cp -R docs "$stage/docs"
          tar -czf "$stage.tar.gz" "$stage"

          # Dragging the app from the disk image to Applications installs GUI, CLI and MCP
          # together. Retain the archive above for users who want a portable layout.
          dmg_stage="${stage}-dmg"
          mkdir -p "$dmg_stage"
          cp -R "$app" "$dmg_stage/Auris Studio.app"
          ln -s /Applications "$dmg_stage/Applications"
          hdiutil create -volname "Auris Studio" -srcfolder "$dmg_stage" \
            -format UDZO -ov "$stage.dmg"

      - name: Verify the disk image
        run: |
          stage="auris-studio-${RELEASE_NAME}-macos-aarch64"
          mount="$RUNNER_TEMP/auris-dmg-verify"
          mkdir -p "$mount"
          hdiutil attach "$stage.dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          diff -qr "$stage/Auris Studio.app" "$mount/Auris Studio.app"
          test "$(readlink "$mount/Applications")" = /Applications

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            auris-studio-*-macos-aarch64.tar.gz
            auris-studio-*-macos-aarch64.dmg
          if-no-files-found: error

  windows:
    name: Build for Windows
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    env:
      AURIS_CLI: ./target/release/auris.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Name branch dry-run artifacts from Cargo version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' }}
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "RELEASE_NAME=v$version" >> "$GITHUB_ENV"

      - name: Load packaging helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            tools/fetch-dictionary.sh
            tools/fetch-dictionary.ps1
            tools/installer/auris-studio.iss
          sparse-checkout-cone-mode: false

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare LLVM for ASIO
        shell: pwsh
        run: ./tools/setup-windows.ps1 -InstallLlvm

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build
        shell: pwsh
        run: |
          $frontends = @('auris-gpui', 'auris-cli', 'auris-mcp')
          $metadataJson = cargo metadata --no-deps --format-version 1 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the checked-out Cargo workspace.' }
          $metadata = $metadataJson | ConvertFrom-Json
          $helper = @($metadata.packages | Where-Object { $_.name -eq 'auris-update-helper' -and $_.id -in $metadata.workspace_members })
          $hasHelper = $helper.Count -eq 1
          $env:AURIS_UPDATE_HELPER = $hasHelper.ToString().ToLowerInvariant()
          "AURIS_UPDATE_HELPER=$($env:AURIS_UPDATE_HELPER)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $asioFrontends = @(
            foreach ($name in $frontends) {
              $package = @($metadata.packages | Where-Object { $_.name -eq $name -and $_.id -in $metadata.workspace_members })
              if ($package.Count -ne 1) { throw "Expected one workspace package named $name." }
              if ('asio' -in $package[0].features.PSObject.Properties.Name) { $name }
            }
          )
          $buildArgs = @('build', '--release', '--locked')
          # New releases opt into ASIO; historical tags included it without a feature.
          if ($asioFrontends.Count -eq $frontends.Count) {
            $buildArgs += @('--features', 'asio')
          } elseif ($asioFrontends.Count -ne 0) {
            throw "Inconsistent ASIO features across release frontends; only these expose asio: $($asioFrontends -join ', ')."
          }
          foreach ($name in $frontends) { $buildArgs += @('-p', $name) }
          cargo @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($hasHelper) {
            cargo build --release --locked -p auris-update-helper
            exit $LASTEXITCODE
          }

      - name: Fetch the shipped Japanese dictionary
        shell: pwsh
        run: ./.release-tools/tools/fetch-dictionary.ps1 -Destination (Join-Path $PWD 'Dictionary') -AurisPath ./target/release/auris.exe

      - name: Assemble the archive
        shell: bash
        run: |
          stage="auris-studio-${RELEASE_NAME}-windows-x86_64"
          mkdir -p "$stage"
          cp target/release/auris-studio.exe target/release/auris.exe target/release/auris-mcp.exe "$stage/"
          if [ "${AURIS_UPDATE_HELPER:-false}" = true ]; then
            cp target/release/auris-update-helper.exe "$stage/"
          fi
          # Beside the binaries, which is the first place `auris_session::library` looks.
          cp -R Dictionary "$stage/Dictionary"
          cp README.md README.ja.md CHANGELOG.md LICENSE "$stage/"
          # The README links into `docs/`, so an archive without it has dead links in the
          # first file anybody opens.
          cp -R docs "$stage/docs"
          7z a "$stage.zip" "$stage"

      - name: Build the per-user installer
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $compiler) {
            $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 compiler was not found.' }
          $stage = (Resolve-Path "auris-studio-${env:RELEASE_NAME}-windows-x86_64").Path
          $icon = (Resolve-Path 'crates/auris-gpui/assets/auris-studio.ico').Path
          $script = (Resolve-Path '.release-tools/tools/installer/auris-studio.iss').Path
          $output = (Get-Location).Path
          $version = $env:RELEASE_NAME -replace '^v', ''
          & $compiler "/DStageDir=$stage" "/DOutputDir=$output" "/DAppVersion=$version" "/DIconPath=$icon" $script
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          $installer = Join-Path $output "auris-studio-v$version-windows-x86_64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer was not created: $installer" }

      - name: Smoke-test the Windows installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_NAME -replace '^v', ''
          $installer = (Resolve-Path "auris-studio-v$version-windows-x86_64-setup.exe").Path
          if ((Get-Item -LiteralPath $installer).VersionInfo.ProductVersion.Trim() -ne $version) {
            throw 'Installer product version does not match the release.'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'Auris installer smoke'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=`"$installDir`"") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)." }
          try {
            $files = @('auris-studio.exe', 'auris.exe', 'auris-mcp.exe', 'Dictionary',
              'README.md', 'README.ja.md', 'CHANGELOG.md', 'LICENSE', 'docs/development.md')
            if ($env:AURIS_UPDATE_HELPER -eq 'true') { $files += 'auris-update-helper.exe' }
            foreach ($file in $files) {
              if (-not (Test-Path -LiteralPath (Join-Path $installDir $file))) { throw "Missing installed file: $file" }
            }
            if ($env:AURIS_UPDATE_HELPER -eq 'true') {
              # Exercise the shipped helper from outside the installation, after its parent
              # exits. A placeholder old executable proves that setup really replaces it.
              $helper = Join-Path $env:RUNNER_TEMP 'auris-update-helper-smoke.exe'
              Copy-Item -LiteralPath (Join-Path $installDir 'auris-update-helper.exe') -Destination $helper
              $app = Join-Path $installDir 'auris-studio.exe'
              $expectedHash = (Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash
              Set-Content -LiteralPath $app -Value 'old executable placeholder'
              $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
              $report = Join-Path $env:RUNNER_TEMP 'auris-update-result.json'
              $parent = Start-Process -FilePath $env:ComSpec -ArgumentList @('/c', 'exit 0') -WindowStyle Hidden -Wait -PassThru
              $update = Start-Process -FilePath $helper -ArgumentList @('apply', '--parent-pid', "$($parent.Id)", '--package', "`"$installer`"", '--app', "`"$app`"", '--sha256', $digest, '--result-file', "`"$report`"") -WindowStyle Hidden -Wait -PassThru
              if ($update.ExitCode -ne 0) { throw "Update helper exited with code $($update.ExitCode)." }
              $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
              if ($result.status -ne 'success') { throw "Update failed: $($result.message)" }
              if ((Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Update did not replace the installed executable.' }
            }
            & (Join-Path $installDir 'auris.exe') help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Installed auris CLI exited with code $LASTEXITCODE." }
          } finally {
            $uninstaller = Join-Path $installDir 'unins000.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru -WindowStyle Hidden
              if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)." }
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            auris-studio-*-windows-x86_64.zip
            auris-studio-*-windows-x86_64-setup.exe
          if-no-files-found: error

  # The command line tool only. The desktop application ships for macOS and Windows; CI does not
  # build the gpui frontend on Linux, and a release is the wrong place to find out whether it
  # would have.
  linux:
    name: Build the command line tool for Linux
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    env:
      AURIS_CLI: ./target/release/auris
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Name branch dry-run artifacts from Cargo version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "RELEASE_NAME=v$version" >> "$GITHUB_ENV"

      - name: Load packaging helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            tools/fetch-dictionary.sh
          sparse-checkout-cone-mode: false

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      # cpal builds against ALSA here, and vst3-host links against XCB.
      - name: Install Linux development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libxcb1-dev

      - name: Build
        run: cargo build --release --locked -p auris-cli

      - name: Fetch the shipped Japanese dictionary
        run: bash .release-tools/tools/fetch-dictionary.sh "$PWD/Dictionary"

      - name: Assemble the archive
        run: |
          stage="auris-${RELEASE_NAME}-linux-x86_64"
          mkdir -p "$stage"
          cp target/release/auris "$stage/"
          # Kanji lyrics use the same dictionary on every platform.
          cp -R Dictionary "$stage/Dictionary"
          cp README.md README.ja.md CHANGELOG.md LICENSE "$stage/"
          # The README links into `docs/`, so an archive without it has dead links in the
          # first file anybody opens.
          cp -R docs "$stage/docs"
          tar -czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: auris-*-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    # Only `gh release create` writes to the repository; build jobs remain read-only.
    permissions:
      contents: write
      actions: read
      checks: read
    name: Publish the release
    needs: [macos, windows, linux]
    # Only from a tag. A dispatched run builds all three and stops here, which is the point of
    # being able to dispatch it at all.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse HEAD)"
          run=$(gh run list --workflow ci.yml --commit "$commit" --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "No source CI run found for $commit" >&2
            exit 1
          fi
          gh run watch "$run" --exit-status --interval 30

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify packaged contents and record checksums
        run: bash tools/verify-release.sh "$RELEASE_NAME" artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: artifacts/SHA256SUMS
          if-no-files-found: error

      # The changelog is the release notes. Taken by heading rather than whole, so a release
      # describes itself and not every release before it; an empty extract fails the job, because
      # notes nobody wrote are worse than a release that did not go out.
      - name: Collect the notes
        run: |
          version="${RELEASE_NAME#v}"
          awk -v want="$version" '
            $0 ~ "^## " want "([ ]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > section.md
          if [ ! -s section.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            cat <<'PREAMBLE'
          ### Downloads

          | File | What it holds |
          | --- | --- |
          | `…-macos-aarch64.dmg` | Drag `Auris Studio.app` to Applications; CLI and MCP are inside the app |
          | `…-windows-x86_64-setup.exe` | Per-user installer for the desktop, CLI and MCP |
          | `…-macos-aarch64.tar.gz` | Portable app, CLI and MCP for Apple Silicon (Intel Macs are no longer supported) |
          | `…-windows-x86_64.zip` | Portable desktop, CLI and MCP executables |
          | `…-linux-x86_64.tar.gz` | the `auris` command line tool only |

          Every archive includes a `Dictionary` directory with the **NAIST Japanese dictionary**
          (BSD-3-Clause, jpreprocess's build), used to read kanji lyrics and their pitch accent.
          On macOS it lives inside the application bundle.

          None of it is code-signed. macOS will refuse the first launch and say the developer
          cannot be verified: open it from the right-click menu once, or run
          `xattr -dr com.apple.quarantine "Auris Studio.app"`. Windows SmartScreen wants
          *More info → Run anyway*.

          Auris Studio is at `0.x`, where nothing is stable: the project format, the configuration
          files and every public API may change in any release, with no migration.

          ---

          PREAMBLE
            cat section.md
          } > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_NAME" \
            --verify-tag --latest \
            --title "Auris Studio ${RELEASE_NAME}" \
            --notes-file notes.md \
            artifacts/*
