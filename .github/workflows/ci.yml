name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Warnings are the point of running this at all.
  RUSTFLAGS: -D warnings

# A pull request only needs its newest push checked, so older runs are cancelled. A push to a
# branch is different: the release workflow will not publish a tag unless CI succeeded on that
# exact commit, so every commit on main keeps its own run. Grouping by the commit rather than the
# branch matters as much as not cancelling: a group holds one pending run, and a newer push would
# still replace one that had not started yet.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  design-adoption:
    name: Check Atelier adoption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check design-language adoption
        run: bash tools/check-design-adoption.sh crates/auris-gpui/src

  # The whole workspace, on the platform the desktop application actually ships for.
  #
  # gpui is built with `runtime_shaders`, so this needs no Xcode beyond the Command Line Tools
  # that every macOS runner already has — see the note in CLAUDE.md.
  macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install

      # ONNX Runtime's Core ML objects use Apple's availability checks. Rust drives the final
      # linker directly, so carry the compiler runtime that provides those symbols with it.
      - name: Link the Apple compiler runtime
        run: |
          clang_runtime="$(xcrun --sdk macosx clang -print-libgcc-file-name)"
          echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=$clang_runtime" >> "$GITHUB_ENV"

      # Keep dependency artifacts, pruning workspace binaries and incremental state. The action
      # keys by rustc, manifests, Cargo configuration and compiler environment automatically.
      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-build-performance
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked

      # `--tests` builds and runs every unit and integration test but leaves the examples alone.
      # Plain `cargo test` also links every example — more than two dozen executables, each
      # carrying the whole dependency graph — and runs nothing in them; Clippy's `--all-targets`
      # above already type-checks them. Doctests are platform-independent, so they run here
      # only, as their own step.
      - name: Test
        run: cargo test --workspace --tests --locked --timings

      - name: Doctests
        run: cargo test --workspace --doc --locked

      - name: Test the release update helper
        run: cargo test -p auris-update-helper --release --locked

      # The forks are excluded from the workspace, so `--workspace` never reaches them and nothing
      # else runs the tests that guard them. For `vendor/vst3-host` that is the whole of its cover:
      # the single-owner realtime path the fork exists for and the process isolation around a
      # plugin that crashes. Two steps rather than one `run:` with two lines, because a
      # multi-command `run:` on the Windows job reports only the last command's exit code. Not
      # `--locked`: each fork's lock file is gitignored on purpose (see `.gitignore`), so there is
      # no lock to hold them to.
      - name: Test the vendored VST3 host
        run: cargo test --manifest-path vendor/vst3-host/Cargo.toml

      - name: Test the vendored synthesiser
        run: cargo test --manifest-path vendor/rustysynth/Cargo.toml

      # The documentation is checked the same way the code is, and on this job because it is the
      # one that builds every crate including the frontend. Nothing was checking it before, which
      # is how two dozen warnings accumulated — among them a macro feeding command line usage text
      # through `#[doc]`, where `<command>` parsed as an HTML tag and `[options]` as a link to a
      # type of that name. `RUSTDOCFLAGS` rather than `RUSTFLAGS`: rustdoc does not read the
      # latter, so the workspace-wide `-D warnings` above does not reach it.
      - name: Document
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  # The whole workspace again, on the other platform the desktop application ships for.
  #
  # This job is the only thing standing between Windows and quiet rot, because nobody here
  # develops on it. It has already caught the things that compile everywhere and work nowhere:
  # gpui's `platform` modifier is ⌘ on macOS and the Windows key on Windows, and half the
  # behaviour that follows from that is decided by `cfg!` rather than by types.
  #
  # This is the default WASAPI build, which needs no LLVM; the ASIO build the releases ship is
  # the next job. They were one job, and since `asio` changes cpal's features every workspace
  # crate compiled twice in a row on the slowest runner — the critical path of the whole run.
  windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install the toolchain
        run: rustup toolchain install

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-build-performance
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch' }}

      - name: Lint the default Windows build
        run: cargo clippy --workspace --all-targets --locked

      # No audio device and no GPU on the runner; every test that needs either checks first and
      # skips. What this does exercise is every `cfg!(target_os = ...)` arm the other two jobs
      # never take — the key bindings, the pointer gestures, the menu bar and the locale.
      # `--tests` skips linking the examples, as on macOS.
      - name: Test the default Windows build
        run: cargo test --workspace --tests --locked --timings

      # Unit tests run on test-runner threads with larger stacks. Launch the actual
      # optimized helper too, using the same main-thread stack as the shipped binary.
      - name: Test the release update helper
        run: cargo test -p auris-update-helper --release --locked

      # Here as well as on macOS, and for this job's own reason: the VST3 host's module loader is
      # a different file per platform, and the Windows one — a private-namespace `LoadLibrary`
      # with its own tests — compiles nowhere else.
      - name: Test the vendored VST3 host
        run: cargo test --manifest-path vendor/vst3-host/Cargo.toml

      - name: Test the vendored synthesiser
        run: cargo test --manifest-path vendor/rustysynth/Cargo.toml

      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  # The feature the shipped Windows binaries are built with, alongside the default build rather
  # than after it.
  windows-asio:
    name: Test on Windows with ASIO
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install the toolchain
        run: rustup toolchain install

      # Restore the default Windows job's cache rather than keep one of its own: rust-cache
      # keys by job, and a key of this job's own started cold on every pull request until main
      # had saved it (52 minutes on the first run). Everything below cpal is the same build; only
      # cpal, asio-sys and what depends on them compile again. Only the default job saves, so
      # the two never race for the key.
      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-build-performance
          shared-key: windows
          save-if: false

      - name: Prepare LLVM for ASIO
        shell: pwsh
        run: ./tools/setup-windows.ps1 -InstallLlvm

      - name: Lint with ASIO
        run: cargo clippy --workspace --all-targets --locked --features asio

      - name: Test with ASIO
        run: cargo test --workspace --tests --locked --features asio --timings

      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ runner.os }}-${{ runner.arch }}-asio
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  # Everything except the gpui frontend, on a platform with no Apple frameworks at all.
  #
  # This is the layering rule from CLAUDE.md turned into a job: nothing at or below
  # `auris-session` may name a UI toolkit, and the fastest way to keep that true is to build the
  # backend and the command line tool somewhere a UI toolkit could not possibly link.
  linux:
    name: Backend without a UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install

      # cpal builds against ALSA on Linux, and vst3-host links against XCB. wgpu loads its
      # backends at run time.
      - name: Install Linux development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libxcb1-dev

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-build-performance
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch' }}

      - name: Lint
        run: cargo clippy --workspace --exclude auris-gpui --all-targets --locked

      # The runner has no audio device and no GPU. Every test that needs either checks first and
      # skips, so this exercises the DSP, the document model and the whole render path.
      - name: Test
        run: cargo test --workspace --exclude auris-gpui --tests --locked --timings

      # The forks are part of the backend this job exists to keep honest, and this is where the
      # XCB headers above are installed for — so the host's third module loader is compiled here
      # and may as well be tested here.
      - name: Test the vendored VST3 host
        run: cargo test --manifest-path vendor/vst3-host/Cargo.toml

      - name: Test the vendored synthesiser
        run: cargo test --manifest-path vendor/rustysynth/Cargo.toml

      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
