name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Warnings are the point of running this at all.
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole workspace, on the platform the desktop application actually ships for.
  #
  # gpui is built with `runtime_shaders`, so this needs no Xcode beyond the Command Line Tools
  # that every macOS runner already has — see the note in CLAUDE.md.
  macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      # The documentation is checked the same way the code is, and on this job because it is the
      # one that builds every crate including the frontend. Nothing was checking it before, which
      # is how two dozen warnings accumulated — among them a macro feeding command line usage text
      # through `#[doc]`, where `<command>` parsed as an HTML tag and `[options]` as a link to a
      # type of that name. `RUSTDOCFLAGS` rather than `RUSTFLAGS`: rustdoc does not read the
      # latter, so the workspace-wide `-D warnings` above does not reach it.
      - name: Document
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # The whole workspace again, on the other platform the desktop application ships for.
  #
  # This job is the only thing standing between Windows and quiet rot, because nobody here
  # develops on it. It has already caught the things that compile everywhere and work nowhere:
  # gpui's `platform` modifier is ⌘ on macOS and the Windows key on Windows, and half the
  # behaviour that follows from that is decided by `cfg!` rather than by types.
  #
  # No system libraries: cpal talks to WASAPI through the `windows` crate, wgpu loads its
  # backends at run time, and gpui's DirectX renderer needs nothing beyond the Windows SDK the
  # runner already has.
  windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked

      # No audio device and no GPU on the runner; every test that needs either checks first and
      # skips. What this does exercise is every `cfg!(target_os = ...)` arm the other two jobs
      # never take — the key bindings, the pointer gestures, the menu bar and the locale.
      - name: Test
        run: cargo test --workspace --locked

  # Everything except the gpui frontend, on a platform with no Apple frameworks at all.
  #
  # This is the layering rule from CLAUDE.md turned into a job: nothing at or below
  # `auris-session` may name a UI toolkit, and the fastest way to keep that true is to build the
  # backend and the command line tool somewhere a UI toolkit could not possibly link.
  linux:
    name: Backend without a UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      # cpal builds against ALSA on Linux, and vst3-host links against XCB. wgpu loads its
      # backends at run time.
      - name: Install Linux development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libxcb1-dev

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Lint
        run: cargo clippy --workspace --exclude auris-gpui --all-targets --locked

      # The runner has no audio device and no GPU. Every test that needs either checks first and
      # skips, so this exercises the DSP, the document model and the whole render path.
      - name: Test
        run: cargo test --workspace --exclude auris-gpui --locked

  # `training/`, which is Python and has nothing to do with the workspace above — except that it
  # writes the voice files `auris-singer` reads, and its `tests/test_host_contract.py` is the only
  # thing checking that the two agree on the metadata format and the phoneme table.
  #
  # That is also why this job carries no path filter. The edit that breaks the contract is as
  # likely to land in `crates/auris-vocal` as in `training/`, so a filter that skipped the job
  # whenever no Python changed would skip it for exactly the changes it exists to catch.
  training:
    name: Voice model trainer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4

      # Pinned to a patch version, not `@v10`: setup-uv stopped publishing floating major and
      # minor tags at v8 deliberately, so the usual shorthand resolves to nothing.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      # `--torch-backend=cpu`, where the documentation gives a person `auto`: the runner has no
      # NVIDIA driver, so detection lands here anyway, and naming it outright is one less thing
      # that can change underneath CI. The `export` extra is not optional here — the ONNX export
      # is the artefact the whole contract is about, and skipping its tests would leave the file
      # format checked only in the abstract.
      - name: Install
        run: |
          uv venv
          uv pip install -e '.[dev,export]' --torch-backend=cpu

      - name: Lint
        run: uv run ruff check .

      # Everything but the tests marked slow, which fetch the FCPE pitch model and the
      # jpreprocess dictionary — a download every run, for coverage the rest already gives.
      - name: Test
        run: uv run pytest -m "not slow"
