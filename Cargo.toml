# A virtual manifest: the root builds nothing itself, so no frontend is privileged over
# another. `cargo run` still launches the desktop application through `default-members`.
[workspace]
members = ["crates/*"]
# Somebody else's crate, forked and kept here — see `vendor/rustysynth/README.md`. Out of the
# workspace on purpose: `--workspace` runs this project's tests, lints and doc build, and holding
# a third party's code to house rules it was never written against would fail the build over
# nothing. Its own tests are run from its own directory.
exclude = ["vendor/midir", "vendor/rustysynth"]
default-members = ["crates/auris-gpui"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/uthree/auris-studio"
rust-version = "1.90"

[workspace.dependencies]
# Backend, in dependency order. Nothing below `auris-session` knows a UI exists.
auris-clap = { path = "crates/auris-clap", version = "0.4.0" }
auris-vst3 = { path = "crates/auris-vst3", version = "0.4.0" }
auris-compose = { path = "crates/auris-compose", version = "0.4.0" }
auris-core = { path = "crates/auris-core", version = "0.4.0" }
auris-dsp = { path = "crates/auris-dsp", version = "0.4.0" }
auris-sampler = { path = "crates/auris-sampler", version = "0.4.0" }
auris-singer = { path = "crates/auris-singer", version = "0.4.0" }
auris-synth = { path = "crates/auris-synth", version = "0.4.0" }
auris-gpu = { path = "crates/auris-gpu", version = "0.4.0" }
auris-i18n = { path = "crates/auris-i18n", version = "0.4.0" }
auris-io = { path = "crates/auris-io", version = "0.4.0" }
auris-vocal = { path = "crates/auris-vocal", version = "0.4.0" }
auris-engine = { path = "crates/auris-engine", version = "0.4.0" }
auris-session = { path = "crates/auris-session", version = "0.4.0" }
auris-toolbox = { path = "crates/auris-toolbox", version = "0.4.0" }

# A hosted plugin's state is an opaque byte stream, and the project file is JSON. Already in the
# lock file by way of other dependencies, so naming it here adds nothing to the build.
base64 = "0.22"
# Hosting third-party plugins. CLAP's Rust bindings are MIT OR Apache-2.0. Since SDK 3.8, the
# Steinberg VST 3 SDK and its Rust host wrapper are MIT too, so both are compatible with this
# Apache-2.0 workspace. `clack-host` and `clack-plugin` are two halves of one project and must be
# resolved together — the tests link a plugin into the host binary.
clack-extensions = "0.1.1"
clack-host = "0.1.1"
clack-plugin = "0.1.1"
bytemuck = { version = "1.16", features = ["derive"] }
cpal = "0.18"
crossbeam-channel = "0.5"
hound = "3.5"
ureq = { version = "2.12", features = ["json"] }
log = "0.4"
env_logger = "0.11"
# Standard MIDI Files, read and written. `parallel` is off: it pulls in rayon to decode tracks
# on a thread pool, and a MIDI file is kilobytes — the pool costs more to start than the parse.
midly = { version = "0.5", default-features = false, features = ["std", "alloc"] }
# Forked temporarily: gpui 0.2.2 pins core-foundation 0.10.0, while midir 0.11's
# CoreMIDI dependency requires core-foundation 0.10.1 or newer. See vendor/midir/README-AURIS.md.
midir = { path = "vendor/midir" }
# Array views make the remaining direct WSOLA correlations explicit. The same version already
# arrives through `ort`, so this declaration makes it usable without adding another copy.
ndarray = "0.16.1"
# A plugin that will only draw inside a window of the host's needs the host to have made one, and
# neither platform's window API is reachable from anything portable. Both versions are the ones
# gpui already resolved, so hosting a plugin adds no second copy of either.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
pollster = "1.0"
# The platform's own window handle and nothing else. A hosted plugin's floating window has to be
# told which window to stay above, and this is the one vocabulary gpui and CLAP already share — so
# a handle travels through `auris-session` without that crate learning what a UI toolkit is.
raw-window-handle = "0.6"
# Planned real and complex FFTs for the spectrum and WSOLA search. Both versions are already in
# the graph through `rubato`; naming them lets `auris-dsp` use their SIMD implementations directly.
realfft = "3.5"
rubato = "4.0"
rustfft = "6.4"
# Reads SoundFont files *and* plays them. Named once here because two crates share the type:
# `auris-io` hands out an `Arc<SoundFont>` and `auris-sampler` renders it, and two resolved
# copies of the library would be two unrelated types with the same name.
# Forked: the published crate reads a SoundFont's modulator lists and throws them away, which
# leaves the shipped font's pianos playing through a filter nothing ever opens. See
# `vendor/rustysynth/README.md`.
rustysynth = { path = "vendor/rustysynth" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
symphonia = { version = "0.6", features = ["all"] }
thiserror = "2.0"
vst3-host = { version = "0.9.0", default-features = false }
# The syntax a song specification is written in. Already in the lock file by way of build-time
# tooling, so naming it here adds nothing to the build.
toml = "1"

# Every backend except Direct3D 12, which does not compile at these versions: `gpu-allocator`
# asks for `windows = ">=0.53, <=0.62"`, gpui pins `windows ^0.61`, so the range resolves to
# 0.61 while `wgpu-hal` itself uses 0.62 — two incompatible copies of `ID3D12Device`. Windows
# runs on Vulkan until that is fixed upstream, and `auris-gpu` is optional analysis that already
# steps aside when no backend is present, so nothing breaks if a machine has neither.
windows = "0.61"

wgpu = { version = "30.0", default-features = false, features = [
    "std",
    "parking_lot",
    "metal",
    "gles",
    "vulkan",
    "wgsl",
    "webgpu",
] }

[profile.dev]
opt-level = 1

# Audio DSP is unusable when compiled without optimisations, so build dependencies at full
# speed even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
