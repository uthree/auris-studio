# A virtual manifest: the root builds nothing itself, so no frontend is privileged over
# another. `cargo run` still launches the desktop application through `default-members`.
[workspace]
members = ["crates/*"]
default-members = ["crates/auris-gpui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uthree/auris-studio"
rust-version = "1.90"

[workspace.dependencies]
# Backend, in dependency order. Nothing below `auris-session` knows a UI exists.
auris-compose = { path = "crates/auris-compose", version = "0.1.0" }
auris-core = { path = "crates/auris-core", version = "0.1.0" }
auris-dsp = { path = "crates/auris-dsp", version = "0.1.0" }
auris-synth = { path = "crates/auris-synth", version = "0.1.0" }
auris-gpu = { path = "crates/auris-gpu", version = "0.1.0" }
auris-i18n = { path = "crates/auris-i18n", version = "0.1.0" }
auris-io = { path = "crates/auris-io", version = "0.1.0" }
auris-engine = { path = "crates/auris-engine", version = "0.1.0" }
auris-session = { path = "crates/auris-session", version = "0.1.0" }

anyhow = "1.0"
arc-swap = "1.7"
bytemuck = { version = "1.16", features = ["derive"] }
cpal = "0.18"
crossbeam-channel = "0.5"
hound = "3.5"
log = "0.4"
env_logger = "0.11"
pollster = "1.0"
rubato = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6", features = ["all"] }
thiserror = "2.0"
wgpu = "30.0"

[profile.dev]
opt-level = 1

# Audio DSP is unusable when compiled without optimisations, so build dependencies at full
# speed even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
